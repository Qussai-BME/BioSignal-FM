name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fm,dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Lint with ruff
        run: ruff check biosignal_fm tests scripts

      - name: Format check with ruff
        run: ruff format --check biosignal_fm tests scripts

      - name: Type check with mypy
        run: mypy biosignal_fm scripts

      - name: Audit installed dependencies
        run: |
          python -m pip install pip-audit
          pip-audit --strict

      - name: Doctest examples
        run: pytest --doctest-modules biosignal_fm -q

      - name: Test with pytest
        run: pytest -v --cov=biosignal_fm --cov-report=xml --cov-fail-under=75

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Docker image
        run: docker build -t biosignal-fm:ci .
      - name: Verify image size
        run: docker images biosignal-fm:ci --format "{{.Size}}"
      - name: Smoke test
        run: docker run --rm biosignal-fm:ci python -c "import biosignal_fm; print(biosignal_fm.__version__)"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build documentation (strict — broken nav/links/docstrings fail the build)
        run: mkdocs build --strict
