[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biosignal-fm"
version = "4.0.1"
description = "BioSignal-FM: a modular multimodal biosignal research platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Qussai Adlbi", email = "qussai.adlbi@proton.me" },
]
maintainers = [
    { name = "Qussai Adlbi", email = "qussai.adlbi@proton.me" },
]
keywords = [
    "biosignal",
    "representation-learning",
    "self-supervised-learning",
    "emg",
    "ecg",
    "eeg",
    "ecog",
    "fnirs",
    "transformer",
    "deep-learning",
    "biomedical-engineering",
    "neural-interface",
    "myoelectric",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
scientific = [
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "joblib>=1.3",
    "tabulate>=0.9",
    "PyWavelets>=1.4",
]
ml = [
    "torch>=2.0",
]
# External MLflow tracking is deliberately not distributed as an extra in V4.
# The latest released MLflow line constrains cryptography<50, while the
# security baseline requires cryptography>=50. Re-enable only after a
# compatible upstream release passes the dependency audit.
deployment = [
    "onnx>=1.14",
    "onnxruntime>=1.15",
    "threadpoolctl>=3.1",
]
data-eeg = [
    "mne>=1.5",
]
data-ecg = [
    "wfdb>=0.4",
]
data-fnirs = [
    "h5py>=3.9",
]
api = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]
ui = [
    "streamlit>=1.30",
]
stats = [
    "statsmodels>=0.14",
]
# Backward-compatible extras retained during the V4 transition.
fm = [
    "torch>=2.0",
    "onnx>=1.14",
    "onnxruntime>=1.15",
    "threadpoolctl>=3.1",
]
data = [
    "scipy>=1.10",
    "wfdb>=0.4",
    "mne>=1.5",
    "h5py>=3.9",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.24",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.4",
    "statsmodels>=0.14",
    "threadpoolctl>=3.1",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
    "mkdocstrings[python]>=0.23",
]
all = [
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "joblib>=1.3",
    "tabulate>=0.9",
    "PyWavelets>=1.4",
    "torch>=2.0",
    "onnx>=1.14",
    "onnxruntime>=1.15",
    "threadpoolctl>=3.1",
    "wfdb>=0.4",
    "mne>=1.5",
    "h5py>=3.9",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "streamlit>=1.30",
    "statsmodels>=0.14",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.24",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.4",
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
    "mkdocstrings[python]>=0.23",
]

[project.urls]
Homepage = "https://github.com/qussaiadlbi/biosignal-fm"
Repository = "https://github.com/qussaiadlbi/biosignal-fm"
Documentation = "https://github.com/qussaiadlbi/biosignal-fm#readme"
"Bug Tracker" = "https://github.com/qussaiadlbi/biosignal-fm/issues"
"Author LinkedIn" = "https://www.linkedin.com/in/qussai-adlbi"

[project.scripts]
biosignal-fm = "biosignal_fm.cli.main:app"
# Short alias — the Typer app itself is named "bsfm" (see cli/main.py) and
# the README/CLI help text consistently use `bsfm ...` in every example, so
# without this alias every copy-pasted command fails with "command not found".
bsfm = "biosignal_fm.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["biosignal_fm*"]
exclude = ["tests*", "docs*", "notebooks*", "benchmarks*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["biosignal_fm", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default arguments (Typer pattern)
    "TID252",  # relative imports are idiomatic within a package
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["B011", "N806", "N812", "N814"]  # assert False, B/J/F variable names OK in tests
"biosignal_fm/models/**" = ["N806", "N812", "N814"]  # B for batch size, F for functional are idiomatic in ML
"biosignal_fm/training/**" = ["N806", "N812"]
"biosignal_fm/evaluation/**" = ["N806"]  # J for Jacobian-like capital vars
"biosignal_fm/ui/**" = ["E402"]  # Streamlit pages have imports after st calls
"biosignal_fm/deployment/serving.py" = ["N815"]  # mixedCase Pydantic fields
"biosignal_fm/baselines/**" = ["N803", "N806", "N812"]  # X for features, C for regularization, F for functional (scikit-learn/torch convention)
"scripts/**" = ["N806"]  # X_train/X_test/X_t etc. -- same scikit-learn convention as biosignal_fm/baselines above

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["torch.*", "mlflow.*", "onnx.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=biosignal_fm",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=75",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "gpu: marks tests requiring GPU",
]
filterwarnings = [
    "error::DeprecationWarning:torch.*",
    "ignore::DeprecationWarning",
    "ignore::UserWarning:torch.*",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["biosignal_fm"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise ImportError",
]
